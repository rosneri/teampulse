services:
  db:
    image: postgres:18-alpine
    container_name: teampulse-db
    environment:
      POSTGRES_USER: teampulse
      POSTGRES_PASSWORD: teampulse
      POSTGRES_DB: teampulse
    # 55432 so this never fights a Postgres already listening on 5432
    ports:
      - "55432:5432"
    volumes:
      # postgres:18+ keeps PGDATA in a versioned subdir of /var/lib/postgresql
      - teampulse-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teampulse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  teampulse-pg:
